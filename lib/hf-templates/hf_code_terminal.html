<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', sans-serif;
    }

    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .terminal-window {
      width: 900px;
      border-radius: 16px;
      background: rgba(13, 16, 23, 0.94);
      border: 1px solid rgba(0, 255, 136, 0.25);
      box-shadow: 
        0 40px 100px rgba(0, 0, 0, 0.8),
        0 0 40px rgba(0, 255, 136, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      opacity: 0;
      transform: scale(0.92);
      will-change: transform, opacity;
      overflow: hidden;
    }

    .terminal-header {
      height: 50px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      padding: 0 20px;
      position: relative;
    }

    .terminal-buttons {
      display: flex;
      gap: 8px;
    }

    .btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .btn-red { background: #FF5F56; }
    .btn-yellow { background: #FFBD2E; }
    .btn-green { background: #27C93F; }

    .terminal-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Fira Code', monospace;
      font-size: 16px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 500;
    }

    .terminal-body {
      padding: 36px;
      min-height: 240px;
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 24px;
      line-height: 1.6;
      color: #00FF88;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .terminal-prompt {
      color: #00B3FF;
      font-weight: 700;
      margin-right: 12px;
    }

    .terminal-cursor {
      display: inline-block;
      width: 12px;
      height: 24px;
      background: #00FF88;
      vertical-align: middle;
      animation: blink 1s step-end infinite;
      box-shadow: 0 0 8px #00FF88;
    }

    @keyframes blink {
      from, to { background-color: transparent }
      50% { background-color: #00FF88 }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="terminal-window" id="terminal">
      <div class="terminal-header">
        <div class="terminal-buttons">
          <div class="btn btn-red"></div>
          <div class="btn btn-yellow"></div>
          <div class="btn btn-green"></div>
        </div>
        <div class="terminal-title" id="terminal-tab">bash - terminal</div>
      </div>
      <div class="terminal-body">
        <span class="terminal-prompt" id="terminal-prompt">~/content_os$</span><span id="terminal-text"></span><span class="terminal-cursor"></span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      const data = {{HF_DATA_JSON}};

      // Render tab title
      const tabEl = document.getElementById('terminal-tab');
      const promptEl = document.getElementById('terminal-prompt');

      const titleVal = data.title || data.titulo || 'bash';
      if (tabEl) tabEl.textContent = titleVal + ' - terminal';

      const subtitleVal = data.subtitle || data.subtitulo || '~/content_os';
      if (promptEl) {
        promptEl.textContent = (subtitleVal.endsWith('$') ? subtitleVal : subtitleVal + '$') + ' ';
      }

      // Dynamic typing animation text
      const targetText = data.text || data.texto || data.content || data.body || '';
      const contentString = targetText || 'echo "Content OS carregado com sucesso!"';
      const textEl = document.getElementById('terminal-text');

      // GSAP Timelines
      const tl = gsap.timeline({ paused: true });
      const terminal = document.getElementById('terminal');

      // T=0 Window zoom entry
      tl.to(terminal, {
        opacity: 1,
        scale: 1,
        duration: 0.6,
        ease: 'power3.out',
      });

      // Simulated typing after entry completes
      tl.add(() => {
        let currentIdx = 0;
        const interval = setInterval(() => {
          if (currentIdx < contentString.length) {
            textEl.textContent += contentString[currentIdx];
            currentIdx++;
          } else {
            clearInterval(interval);
          }
        }, 30); // ~33 letters per second
      }, 0.6);

      // Floating breath
      tl.to(terminal, {
        y: -5,
        duration: 2.2,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: -1,
      }, 0.6);

      window.__timelines['hf_code_terminal'] = tl;
      tl.play();
    })();
  </script>
</body>
</html>
