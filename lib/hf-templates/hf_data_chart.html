<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', Arial, sans-serif;
    }

    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: rgba(4, 4, 6, 0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 100px;
    }

    /* Left Info Block */
    .dashboard-info {
      width: 600px;
      padding: 50px;
      border-radius: 24px;
      background: rgba(10, 10, 14, 0.85);
      border: 1px solid rgba(0, 255, 136, 0.2);
      box-shadow: 
        0 40px 100px rgba(0, 0, 0, 0.6),
        0 0 40px rgba(0, 255, 136, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      opacity: 0;
      transform: translateX(-50px);
      will-change: transform, opacity;
      z-index: 10;
    }

    .eyebrow {
      font-size: 20px;
      font-weight: 800;
      color: #00FF88;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .headline {
      font-size: 56px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.1;
      margin-bottom: 24px;
      letter-spacing: -0.03em;
    }

    .subtitle {
      font-size: 22px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 30px;
      font-weight: 400;
    }

    .metric-box {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 22px;
      border-radius: 12px;
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid rgba(0, 255, 136, 0.3);
    }

    .metric-value {
      font-size: 28px;
      font-weight: 800;
      color: #00FF88;
      letter-spacing: -0.01em;
    }

    /* Right Chart Container */
    .chart-container {
      width: 950px;
      height: 600px;
      padding: 40px;
      border-radius: 24px;
      background: rgba(10, 10, 14, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      opacity: 0;
      transform: scale(0.95);
      will-change: transform, opacity;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 16px;
    }

    .chart-title {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
    }

    .chart-legend {
      display: flex;
      gap: 16px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #00FF88;
    }

    .chart-view {
      width: 100%;
      height: 400px;
      position: relative;
    }

    .grid-line {
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 1;
    }

    .trend-curve {
      fill: none;
      stroke: #00FF88;
      stroke-width: 4;
      stroke-linecap: round;
      filter: drop-shadow(0 0 10px rgba(0, 255, 136, 0.6));
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
    }

    .trend-area {
      fill: url(#area-gradient);
      opacity: 0;
    }

    .pulse-point {
      fill: #00FF88;
      stroke: #ffffff;
      stroke-width: 3;
      filter: drop-shadow(0 0 8px #00FF88);
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="dashboard-info" id="info-panel">
      <div class="eyebrow">Métricas e Dados</div>
      <div class="headline" id="hf-title">Crescimento</div>
      <div class="subtitle" id="hf-subtitle">Desempenho acelerado e otimização contínua de recursos estratégicos.</div>
      <div class="metric-box" id="hf-metric-container">
        <span class="metric-value" id="hf-metrics">94.2% Eficiência</span>
      </div>
    </div>

    <div class="chart-container" id="chart-panel">
      <div class="chart-header">
        <span class="chart-title">Métricas Operacionais</span>
        <div class="chart-legend">
          <div class="legend-item">
            <span class="legend-dot"></span>
            <span>Realizado</span>
          </div>
        </div>
      </div>

      <div class="chart-view">
        <svg width="100%" height="100%" viewBox="0 0 870 400" id="chart-svg">
          <defs>
            <linearGradient id="area-gradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#00FF88" stop-opacity="0.25" />
              <stop offset="100%" stop-color="#00FF88" stop-opacity="0.0" />
            </linearGradient>
          </defs>

          <!-- Grid Lines -->
          <line x1="0" y1="80" x2="870" y2="80" class="grid-line" />
          <line x1="0" y1="160" x2="870" y2="160" class="grid-line" />
          <line x1="0" y1="240" x2="870" y2="240" class="grid-line" />
          <line x1="0" y1="320" x2="870" y2="320" class="grid-line" />

          <!-- Area under curve -->
          <!-- Path starting at (0, 350) and moving through (150, 310), (300, 240), (450, 180), (600, 100), (750, 60), ending at (870, 50) -->
          <path id="curve-area" d="M 0 350 Q 150 310 300 240 T 600 100 T 870 50 L 870 400 L 0 400 Z" class="trend-area" />

          <!-- Neon Curve Path -->
          <path id="curve-path" d="M 0 350 Q 150 310 300 240 T 600 100 T 870 50" class="trend-curve" />

          <!-- Pulse Tracking Point -->
          <circle id="tracker" cx="870" cy="50" r="10" class="pulse-point" />
        </svg>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      const data = {{HF_DATA_JSON}};

      // Render Title & Subtitle
      const titleEl = document.getElementById('hf-title');
      if (titleEl) titleEl.textContent = data.title || 'Análise Técnica';

      const subtitleEl = document.getElementById('hf-subtitle');
      if (subtitleEl) subtitleEl.textContent = data.subtitle || 'Comportamento de dados dinâmicos em tempo real.';

      const metricContainer = document.getElementById('hf-metric-container');
      const metricsText = data.metrics || data.kpi || '';
      if (metricContainer) {
        if (metricsText && metricsText !== '—') {
          metricContainer.style.display = 'inline-flex';
          const metricVal = document.getElementById('hf-metrics');
          if (metricVal) metricVal.textContent = metricsText;
        } else {
          metricContainer.style.display = 'none';
        }
      }

      // GSAP Timelines
      const tl = gsap.timeline({ paused: true });
      const infoPanel = document.getElementById('info-panel');
      const chartPanel = document.getElementById('chart-panel');
      const curve = document.getElementById('curve-path');
      const area = document.getElementById('curve-area');
      const tracker = document.getElementById('tracker');

      // T=0 Panels transition in
      tl.to(infoPanel, {
        opacity: 1,
        x: 0,
        duration: 0.6,
        ease: 'power3.out',
      }, 0);

      tl.to(chartPanel, {
        opacity: 1,
        scale: 1,
        duration: 0.8,
        ease: 'power3.out',
      }, 0.1);

      // T=0.4 Draw trend curve
      tl.to(curve, {
        strokeDashoffset: 0,
        duration: 1.6,
        ease: 'power2.out',
      }, 0.4);

      // T=0.8 Fade in area gradient
      tl.to(area, {
        opacity: 1,
        duration: 0.8,
        ease: 'power1.out',
      }, 0.8);

      // T=1.4 Show tracker point
      tl.to(tracker, {
        opacity: 1,
        scale: 1,
        duration: 0.4,
        ease: 'back.out(2)',
      }, 1.4);

      // Endless breathing pulse on tracker
      tl.to(tracker, {
        r: 14,
        duration: 0.8,
        yoyo: true,
        repeat: -1,
        ease: 'sine.inOut',
      }, 1.8);

      window.__timelines['hf_data_chart'] = tl;
      tl.play();
    })();
  </script>
</body>
</html>
