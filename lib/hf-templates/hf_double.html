<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: 'Inter', Arial, sans-serif; }
    #root { position: relative; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }

    /* Vertical divider line */
    .v-divider {
      position: absolute; left: 672px; top: 10%; bottom: 10%;
      width: 2px;
      background: linear-gradient(180deg, transparent, rgba(0,255,136,0.5) 30%, rgba(0,255,136,0.5) 70%, transparent);
      transform-origin: top center; scaleY: 0;
      opacity: 0; will-change: transform, opacity;
    }

    /* Right content panel */
    .right-panel {
      position: absolute;
      left: 700px; top: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column; justify-content: center;
      padding: 80px 100px 80px 72px;
      opacity: 0; will-change: opacity, transform;
    }

    .rp-label {
      font-size: 24px; font-weight: 900; letter-spacing: 0.25em;
      text-transform: uppercase; color: #00FF88;
      margin-bottom: 30px;
    }

    .rp-headline {
      font-size: 110px; font-weight: 900; line-height: 0.92;
      letter-spacing: -0.04em; color: #FFFFFF;
      margin-bottom: 30px;
      text-shadow: 0 2px 40px rgba(0,0,0,0.9);
    }

    .rp-headline .word { display: inline-block; margin-right: 0.1em; }

    .rp-subtitle {
      font-size: 38px; font-weight: 400; line-height: 1.5;
      color: rgba(255,255,255,0.72);
      margin-bottom: 44px; max-width: 900px;
    }

    /* HUD lines decoration */
    .hud-lines {
      display: flex; flex-direction: column; gap: 12px;
      margin-bottom: 36px;
    }
    .hud-line {
      height: 2px; border-radius: 1px;
      background: rgba(255,255,255,0.08);
      width: 0; will-change: width;
    }
    .hud-line.hl-accent { background: rgba(0,255,136,0.30); }

    /* Metrics */
    .rp-metrics {
      display: inline-flex; align-items: center; gap: 14px;
      padding: 20px 32px; border-radius: 16px;
      background: rgba(0,255,136,0.08);
      border: 1px solid rgba(0,255,136,0.20);
      font-size: 44px; font-weight: 900; color: #00FF88;
      opacity: 0; will-change: transform, opacity;
      align-self: flex-start;
    }

    /* Left side — avatar zone indicator (subtle) */
    .avatar-zone {
      position: absolute; left: 0; top: 0; width: 672px; height: 1080px;
      /* Empty — avatar goes here in CapCut */
      /* Optional: very subtle gradient on right edge */
      background: linear-gradient(90deg, transparent 85%, rgba(0,255,136,0.04) 100%);
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="avatar-zone"></div>
    <div class="v-divider" id="divider"></div>

    <div class="right-panel" id="right-panel">
      <div class="rp-label">ANÁLISE</div>

      <div class="hud-lines">
        <div class="hud-line hl-accent" id="hl1"></div>
        <div class="hud-line" id="hl2"></div>
      </div>

      <div class="rp-headline" id="headline"></div>
      <div class="rp-subtitle" id="subtitle">{{SUBTITLE}}</div>
      <div class="rp-metrics" id="metrics" style="display:none">
        <span>▲</span><span id="metrics-text">{{METRICS}}</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const data = {{HF_DATA_JSON}};

      const headlineEl = document.getElementById('headline');
      const titleText = data.title || data.titulo || data.headline || data.subtitle || 'Destaque';
      const words = String(titleText).split(' ').filter(Boolean);
      headlineEl.innerHTML = words.map(w => `<span class="word">${w}</span>`).join('');

      if (!data.subtitle || data.subtitle === '—') document.getElementById('subtitle').style.display = 'none';
      if (data.metrics && data.metrics !== '—') {
        document.getElementById('metrics').style.display = 'inline-flex';
        document.getElementById('metrics-text').textContent = data.metrics;
      }

      const tl = gsap.timeline({ paused: true });

      tl.fromTo('#divider', { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.5, ease: 'power3.out', transformOrigin: 'top center' }, 0);
      tl.to('#hl1', { width: '100%', duration: 0.6, ease: 'expo.out' }, 0.2);
      tl.to('#hl2', { width: '70%', duration: 0.5, ease: 'expo.out' }, 0.3);
      tl.fromTo('#right-panel', { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: 'expo.out' }, 0.25);
      tl.fromTo('.word', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power2.out', stagger: 0.07 }, 0.4);
      tl.fromTo('#subtitle', { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: 'power2.out' }, 0.65);
      tl.fromTo('#metrics', { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(1.4)' }, 0.78);

      window.__timelines['hf_double'] = tl;
      tl.play();
    })();
  </script>
</body>
</html>
