<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: 'Inter', Arial, sans-serif; }
    #root { position: relative; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }

    /* Top-right avatar frame */
    .avatar-frame {
      position: absolute; right: 60px; top: 50px;
      width: 320px; height: 320px; border-radius: 28px;
      border: 2px solid rgba(255,255,255,0.15);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(255,180,0,0.06);
      opacity: 0; will-change: transform, opacity;
    }
    .hud-corner { position: absolute; width: 18px; height: 18px; border-color: rgba(255,180,0,0.7); border-style: solid; }
    .hud-tl { top:-1px;left:-1px; border-width:3px 0 0 3px; border-radius:4px 0 0 0; }
    .hud-tr { top:-1px;right:-1px; border-width:3px 3px 0 0; border-radius:0 4px 0 0; }
    .hud-bl { bottom:-1px;left:-1px; border-width:0 0 3px 3px; border-radius:0 0 0 4px; }
    .hud-br { bottom:-1px;right:-1px; border-width:0 3px 3px 0; border-radius:0 0 4px 0; }

    /* Idle indicator dot */
    .live-dot {
      position: absolute; top: 16px; left: 16px;
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 900; letter-spacing: 0.15em;
      text-transform: uppercase; color: rgba(255,180,0,0.8);
    }
    .live-dot-circle {
      width: 8px; height: 8px; border-radius: 50%; background: #FFB400;
    }

    /* Main content area (left + bottom) */
    .main-content {
      position: absolute; top: 0; left: 0;
      right: 460px; bottom: 0;
      display: flex; flex-direction: column; justify-content: center;
      padding: 80px 80px;
      opacity: 0; will-change: opacity, transform;
    }
    .mc-label { font-size: 16px; font-weight: 900; letter-spacing: 0.25em; text-transform: uppercase; color: #FFB400; margin-bottom: 24px; }
    .mc-headline { font-size: 76px; font-weight: 900; line-height: 0.95; letter-spacing: -0.04em; color: #FFFFFF; margin-bottom: 28px; }
    .mc-headline .word { display: inline-block; margin-right: 0.1em; }
    .mc-subtitle { font-size: 28px; font-weight: 400; color: rgba(255,255,255,0.65); line-height: 1.45; }

    /* Bottom panel under avatar frame */
    .side-panel {
      position: absolute; right: 60px; top: 400px;
      width: 320px;
      padding: 28px 32px; border-radius: 18px;
      background: rgba(10,10,10,0.80);
      border: 1px solid rgba(255,180,0,0.18);
      backdrop-filter: blur(14px);
      opacity: 0; will-change: opacity, transform;
    }
    .sp-metric { font-size: 44px; font-weight: 900; color: #FFB400; margin-bottom: 6px; }
    .sp-desc   { font-size: 18px; font-weight: 400; color: rgba(255,255,255,0.50); }

    /* Vertical accent line */
    .v-accent {
      position: absolute; right: 420px; top: 10%; height: 0;
      width: 2px; background: linear-gradient(180deg, transparent, rgba(255,180,0,0.40), transparent);
      will-change: height;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="v-accent" id="v-accent"></div>

    <div class="main-content" id="main-content">
      <div class="mc-label">EM ANÁLISE</div>
      <div class="mc-headline" id="headline"></div>
      <div class="mc-subtitle" id="subtitle">{{SUBTITLE}}</div>
    </div>

    <div class="avatar-frame" id="avatar-frame">
      <div class="hud-corner hud-tl"></div>
      <div class="hud-corner hud-tr"></div>
      <div class="hud-corner hud-bl"></div>
      <div class="hud-corner hud-br"></div>
      <div class="live-dot">
        <div class="live-dot-circle" id="live-circle"></div>
        <span>AO VIVO</span>
      </div>
    </div>

    <div class="side-panel" id="side-panel">
      <div class="sp-metric" id="sp-metric">{{METRICS}}</div>
      <div class="sp-desc">dado verificado</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const data = {{HF_DATA_JSON}};

      const headlineEl = document.getElementById('headline');
      const words = (data.title || '{{TITLE}}').split(' ');
      headlineEl.innerHTML = words.map(w => `<span class="word">${w}</span>`).join('');

      if (!data.subtitle || data.subtitle === '—') document.getElementById('subtitle').style.display = 'none';
      if (!data.metrics  || data.metrics  === '—') {
        document.getElementById('side-panel').style.display = 'none';
      } else {
        document.getElementById('sp-metric').textContent = data.metrics;
      }

      const tl = gsap.timeline({ paused: true });

      tl.to('#v-accent', { height: '80%', duration: 0.5, ease: 'expo.out' }, 0);
      tl.fromTo('#avatar-frame', { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'back.out(1.2)' }, 0.1);
      tl.fromTo('#main-content', { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: 'expo.out' }, 0.2);
      tl.fromTo('.word', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power2.out', stagger: 0.07 }, 0.38);
      tl.fromTo('#subtitle', { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: 'power2.out' }, 0.65);
      tl.fromTo('#side-panel', { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'expo.out' }, 0.55);

      // Live dot pulse
      tl.to('#live-circle', { scale: 1.4, opacity: 0.5, duration: 0.6, ease: 'sine.inOut', yoyo: true, repeat: -1 }, 0.8);

      window.__timelines['hf_face_top'] = tl;
      tl.play();
    })();
  </script>
</body>
</html>
