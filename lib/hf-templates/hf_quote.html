<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', sans-serif;
    }

    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .quote-container {
      width: 1000px;
      padding: 60px 80px;
      border-radius: 28px;
      background: rgba(10, 10, 14, 0.88);
      border: 1px solid rgba(255, 215, 0, 0.2);
      box-shadow: 
        0 40px 100px rgba(0, 0, 0, 0.8),
        0 0 50px rgba(255, 215, 0, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      opacity: 0;
      transform: translateY(30px);
      will-change: transform, opacity;
      position: relative;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .quote-mark {
      font-family: 'Playfair Display', serif;
      font-size: 150px;
      line-height: 1;
      color: #FFD700;
      opacity: 0.15;
      position: absolute;
      will-change: transform;
      filter: drop-shadow(0 0 10px #FFD700);
    }

    .quote-mark-start {
      left: 40px;
      top: 10px;
    }

    .quote-mark-end {
      right: 40px;
      bottom: -40px;
    }

    .quote-body {
      font-family: 'Playfair Display', serif;
      font-size: 38px;
      line-height: 1.45;
      color: #ffffff;
      font-style: italic;
      font-weight: 400;
      z-index: 2;
      letter-spacing: -0.01em;
    }

    .quote-author-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      z-index: 2;
    }

    .quote-line {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #FFD700, transparent);
      margin-bottom: 8px;
    }

    .quote-author {
      font-size: 20px;
      font-weight: 700;
      color: #FFD700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .quote-role {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="quote-container" id="quote-card">
      <div class="quote-mark quote-mark-start">“</div>
      
      <div class="quote-body" id="quote-text">
        "A única maneira de fazer um excelente trabalho é amar o que você faz."
      </div>
      
      <div class="quote-author-box">
        <div class="quote-line"></div>
        <div class="quote-author" id="quote-author">Steve Jobs</div>
        <div class="quote-role" id="quote-role">Fundador da Apple</div>
      </div>

      <div class="quote-mark quote-mark-end">”</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      const data = {{HF_DATA_JSON}};

      // Render author & text
      const authorEl = document.getElementById('quote-author');
      const roleEl = document.getElementById('quote-role');
      const textEl = document.getElementById('quote-text');

      const authorVal = data.title || data.titulo || 'Steve Jobs';
      if (authorEl) authorEl.textContent = authorVal;

      const roleVal = data.subtitle || data.subtitulo || '';
      if (roleEl) {
        if (roleVal && roleVal !== '—') {
          roleEl.textContent = roleVal;
          roleEl.style.display = 'block';
        } else {
          roleEl.style.display = 'none';
        }
      }

      const bodyVal = data.text || data.texto || data.content || data.body || '';
      if (textEl) {
        textEl.textContent = bodyVal || 'A única maneira de fazer um excelente trabalho é amar o que você faz.';
      }

      // GSAP Animation
      const tl = gsap.timeline({ paused: true });
      const card = document.getElementById('quote-card');

      tl.to(card, {
        opacity: 1,
        y: 0,
        duration: 0.6,
        ease: 'power3.out',
      });

      // Floating breath
      tl.to(card, {
        y: -6,
        duration: 2.0,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: -1,
      }, 0.6);

      window.__timelines['hf_quote'] = tl;
      tl.play();
    })();
  </script>
</body>
</html>
