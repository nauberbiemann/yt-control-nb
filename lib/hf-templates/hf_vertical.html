<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: 'Inter', Arial, sans-serif; }
    #root { position: relative; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }

    /* Vertical video frame on the left */
    .vertical-frame {
      position: absolute; left: 80px; top: 80px; bottom: 80px;
      width: 520px; border-radius: 32px;
      border: 2px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.4);
      box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 60px rgba(0,200,255,0.05);
      opacity: 0; will-change: transform, opacity;
      /* The actual video is placed underneath this transparent window by CapCut */
    }

    /* HUD Corner decorations */
    .hud-corner { position: absolute; width: 24px; height: 24px; border-color: rgba(0,200,255,0.6); border-style: solid; }
    .hud-tl { top: -2px; left: -2px; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
    .hud-tr { top: -2px; right: -2px; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
    .hud-bl { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
    .hud-br { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

    /* Frame Label */
    .frame-label {
      position: absolute; top: -40px; left: 0; right: 0;
      text-align: center; font-size: 14px; font-weight: 900;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: rgba(0,200,255,0.8);
    }

    /* Main text content on the right */
    .main-content {
      position: absolute; top: 0; left: 680px; right: 100px;
      height: 1080px;
      display: flex; flex-direction: column; justify-content: center;
      opacity: 0; will-change: opacity, transform;
    }

    .mc-label { font-size: 16px; font-weight: 900; letter-spacing: 0.25em; text-transform: uppercase; color: #00C8FF; margin-bottom: 24px; }
    .mc-headline { font-size: 88px; font-weight: 900; line-height: 0.95; letter-spacing: -0.04em; color: #FFFFFF; margin-bottom: 28px; }
    .mc-headline .word { display: inline-block; margin-right: 0.12em; }
    .mc-subtitle { font-size: 32px; font-weight: 400; color: rgba(255,255,255,0.65); line-height: 1.45; max-width: 900px; }

    /* Metric box */
    .metric-box {
      margin-top: 50px;
      display: inline-flex; align-items: center; gap: 20px;
      padding: 16px 32px; border-radius: 20px;
      background: rgba(0,200,255,0.08); border: 1px solid rgba(0,200,255,0.2);
      opacity: 0; will-change: opacity, transform;
    }
    .metric-val { font-size: 42px; font-weight: 900; color: #00C8FF; }
    .metric-label { font-size: 18px; font-weight: 700; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.1em; }

    /* Vertical line accent */
    .v-line {
      position: absolute; left: 640px; top: 200px; bottom: 200px; width: 2px;
      background: linear-gradient(180deg, transparent, rgba(0,200,255,0.4), transparent);
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="root">
    
    <div class="vertical-frame" id="vertical-frame">
      <div class="hud-corner hud-tl"></div>
      <div class="hud-corner hud-tr"></div>
      <div class="hud-corner hud-bl"></div>
      <div class="hud-corner hud-br"></div>
      <div class="frame-label">HIGHLIGHT VIEW</div>
    </div>

    <div class="v-line" id="v-line"></div>

    <div class="main-content" id="main-content">
      <div class="mc-label">INSIGHT</div>
      <div class="mc-headline" id="headline"></div>
      <div class="mc-subtitle" id="subtitle">{{SUBTITLE}}</div>
      
      <div class="metric-box" id="metric-box">
        <div class="metric-val" id="metric-val">{{METRICS}}</div>
        <div class="metric-label">INDICADOR</div>
      </div>
    </div>
    
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const data = {{HF_DATA_JSON}};

      const headlineEl = document.getElementById('headline');
      const titleText = data.title || data.titulo || data.texto_vertical || data.headline || data.subtitle || 'Insight';
      const words = String(titleText).split(' ').filter(Boolean);
      headlineEl.innerHTML = words.map(w => `<span class="word">${w}</span>`).join('');

      if (!data.subtitle || data.subtitle === '—') document.getElementById('subtitle').style.display = 'none';
      if (!data.metrics  || data.metrics  === '—') {
        document.getElementById('metric-box').style.display = 'none';
      } else {
        document.getElementById('metric-val').textContent = data.metrics;
      }

      const tl = gsap.timeline({ paused: true });

      // Frame entrance
      tl.fromTo('#vertical-frame', { scale: 0.95, x: -40, opacity: 0 }, { scale: 1, x: 0, opacity: 1, duration: 0.6, ease: 'expo.out' }, 0);
      
      // Vertical line
      tl.fromTo('#v-line', { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.7, ease: 'power3.inOut' }, 0.2);

      // Main content fade
      tl.fromTo('#main-content', { x: 30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: 'expo.out' }, 0.3);
      
      // Words stagger
      tl.fromTo('.word', { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'power2.out', stagger: 0.05 }, 0.4);
      
      // Subtitle
      tl.fromTo('#subtitle', { y: 15, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power2.out' }, 0.7);
      
      // Metric box
      tl.fromTo('#metric-box', { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'back.out(1.5)' }, 0.85);

      window.__timelines['hf_vertical'] = tl;
      tl.play();
    })();
  </script>
</body>
</html>
